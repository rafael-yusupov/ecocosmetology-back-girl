/* Layout: mobile-first single column, arched hero photo, green "leaf" bands for offer and final form, sticky booking bar */
:root{
  --cream:#EFE8DD; --paper:#F7F2EA; --ink:#1E3428; --ink-soft:#4C5A50; --muted:#7D8579;
  --green:#1F3A2B; --green-2:#2C4E3A; --gold:#B39A6E; --line:#D8CDBB; --rose:#9C3B2E;
  --on-green:#F3ECE0; --card:#FBF8F3;
  --f-display:"Oranienbaum","Times New Roman",Georgia,serif;
  --f-label:"Forum","Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cream:#14211A; --paper:#182821; --ink:#ECE4D6; --ink-soft:#C3BBAD; --muted:#99A094;
  --green:#0E1913; --green-2:#1D3327; --gold:#C9AE7E; --line:#2E4237; --rose:#E08A72;
  --on-green:#F3ECE0; --card:#1C2E25; color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#14211A; --paper:#182821; --ink:#ECE4D6; --ink-soft:#C3BBAD; --muted:#99A094;
  --green:#0E1913; --green-2:#1D3327; --gold:#C9AE7E; --line:#2E4237; --rose:#E08A72;
  --on-green:#F3ECE0; --card:#1C2E25; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.6 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:18px}
.eyebrow{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.18em;font-size:12.5px;color:var(--gold)}
.rule{display:block;width:56px;height:1px;background:var(--gold);margin:14px 0}
section{padding-block:36px}
.sec-head{display:grid;gap:4px;margin-bottom:18px}
.sec-head h2{font-size:clamp(34px,9vw,54px);text-transform:uppercase}
.lede{color:var(--ink-soft);max-width:60ch}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-label);font-weight:400;letter-spacing:.14em;font-size:14px;line-height:1.1;display:block}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.top-cta{font:600 13px var(--f-body);color:var(--green);text-decoration:none;border:1px solid var(--green);padding:8px 14px;border-radius:999px}
:root[data-theme="dark"] .top-cta{color:var(--ink);border-color:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top-cta{color:var(--ink);border-color:var(--line)}}

/* hero */
.hero{padding-block:4px 24px;display:grid;gap:26px}
.hero h1{font-size:clamp(32px,9.6vw,76px);text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--gold)}

.arch .stamp{position:absolute;left:14px;bottom:14px;right:14px;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(6px);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.stamp .big{white-space:nowrap;font-family:var(--f-display);font-size:40px;line-height:.9;color:var(--ink)}
.stamp .small{font-size:12.5px;color:var(--ink-soft);line-height:1.35}
@media (min-width:880px){
  .hero{grid-template-columns:1.15fr .85fr;align-items:center;padding-top:28px}
  .arch{aspect-ratio:4/5}
}

/* offer card */
.offer{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.offer-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.offer-row .k{font-size:13px;color:var(--muted)}
.offer-row .v{font-weight:700}
.seats{display:grid;gap:8px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.dots i{height:8px;border-radius:4px;background:var(--green-2)}
.dots i.taken{background:var(--line)}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.timer div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 2px}
.timer b{display:block;font:400 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.timer span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{font-size:12.5px;color:var(--muted)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:14px 20px;border:0;border-radius:14px;
  background:var(--green);color:var(--on-green);font:700 16px var(--f-body);text-decoration:none;cursor:pointer;
  box-shadow:0 10px 24px -14px rgba(20,40,28,.9);transition:transform .15s ease,background .15s}
.btn:hover{background:var(--green-2)}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.top-cta:focus-visible,input:focus-visible,summary:focus-visible,.chip:focus-within{outline:2px solid var(--gold);outline-offset:3px}
.btn small{font-weight:500;opacity:.8}
.btn.light{background:var(--on-green);color:#1F3A2B}

/* pains */
.pains{display:grid;gap:10px}
.pain{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.pain svg{width:24px;height:24px;color:var(--gold);margin-top:2px}
.pain b{display:block;font-weight:600}
.pain p{color:var(--ink-soft);font-size:15px}
@media (min-width:880px){.pains{grid-template-columns:1fr 1fr;column-gap:40px}}

/* why home fails */
.why{background:var(--paper);border-block:1px solid var(--line)}
.facts{display:grid;gap:14px}
.fact{display:grid;gap:4px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.fact .n{font-family:var(--f-display);font-size:30px;color:var(--gold);line-height:1}
.fact p{color:var(--ink-soft);font-size:15px}
@media (min-width:880px){.facts{grid-template-columns:repeat(3,1fr)}}

/* steps */
.steps{display:grid;gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.step .ill{width:96px;height:96px;border-radius:14px;background:var(--paper);display:grid;place-items:center}
.step .ill svg{width:86px;height:86px;color:var(--ink)}
.step .no{font-family:var(--f-label);font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.step h3{font-size:25px;margin:2px 0 4px}
.step p{font-size:14.5px;color:var(--ink-soft);line-height:1.5}
.step.opt{border-style:dashed}
@media (min-width:880px){.steps{grid-template-columns:1fr 1fr}}
.callout{margin-top:18px;padding:16px 18px;border-left:2px solid var(--gold);background:var(--paper);border-radius:0 12px 12px 0;font-size:14.5px;color:var(--ink-soft)}
.callout b{color:var(--ink)}

/* two roads */
.roads{display:grid;gap:14px}
.road{border-radius:18px;padding:20px;display:grid;gap:12px}
.road h3{font-size:28px;text-transform:uppercase}
.road ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.road li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:15px}
.road.a{background:var(--paper);border:1px solid var(--line);color:var(--ink-soft)}
.road.a h3{color:var(--muted)}
.road.a li::before{content:"✕";color:var(--rose);font-weight:700}

.road.b::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(14,28,20,.55),rgba(14,28,20,.88))}
.road.b>*{position:relative}
.road.b li::before{content:"✓";color:var(--gold);font-weight:700}
.road .tag{font-family:var(--f-label);letter-spacing:.16em;font-size:12px;text-transform:uppercase}
@media (min-width:880px){.roads{grid-template-columns:1fr 1fr}}

/* men */
.men{display:grid;gap:18px;align-items:center}
.men .q{font-family:var(--f-display);font-size:clamp(30px,8vw,46px);line-height:1.05;text-transform:uppercase}
.men ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.men li{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px}
@media (min-width:880px){.men{grid-template-columns:1fr 1fr;gap:40px}}

/* trust */
.trust{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.trust div{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.trust b{display:block;font:400 30px/1 var(--f-display)}
.trust span{font-size:13px;color:var(--ink-soft)}
@media (min-width:880px){.trust{grid-template-columns:repeat(4,1fr)}}
.reviews{display:grid;gap:12px;margin-top:22px}
.review{padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.review p{font-size:15px}
.review .who{margin-top:10px;font-size:13px;color:var(--muted)}

/* faq */
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:18px 34px 18px 0;position:relative;font-weight:600;font-size:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:4px;top:12px;font:400 28px var(--f-display);color:var(--gold);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 18px;color:var(--ink-soft);font-size:15px;max-width:62ch}

.final::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(13,26,18,.72),rgba(13,26,18,.94))}
.final>.wrap{position:relative}
.final h2{font-size:clamp(38px,10vw,62px);text-transform:uppercase}
.final .eyebrow{color:var(--gold)}
.final .lede{color:#D9D1C2}
form{display:grid;gap:12px;margin-top:22px;max-width:520px}
label{display:grid;gap:6px;font-size:13px;color:#CFC6B6}
input[type=text],input[type=tel]{width:100%;min-height:54px;padding:12px 14px;border-radius:12px;border:1px solid rgba(243,236,224,.25);
  background:rgba(243,236,224,.08);color:#F3ECE0;font:500 17px var(--f-body)}
input::placeholder{color:rgba(243,236,224,.45)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:block;padding:10px 14px;border-radius:999px;border:1px solid rgba(243,236,224,.3);font-size:14px;color:#F3ECE0}
.chip input:checked+span{background:#F3ECE0;color:#1F3A2B;border-color:#F3ECE0}
.err{color:#F0B4A3;font-size:13px;margin-top:-4px}
input[aria-invalid="true"]{border-color:#E59A86}
.final .timer div{background:rgba(243,236,224,.08);border-color:rgba(243,236,224,.18)}
.final .timer b{color:#F3ECE0}
.f-seats{font-size:14px;color:#D9D1C2}
.f-seats b{color:#F3ECE0}
.f-seats p b{color:var(--gold)}
.f-seats .meter{background:rgba(243,236,224,.18)}
.final .timer span,.final .note{color:#BFB6A6}
.final-grid{display:grid;gap:26px}
@media (min-width:880px){.final-grid{grid-template-columns:1fr 1fr;align-items:start}}
.done{display:grid;gap:12px;max-width:520px;margin-top:22px;padding:20px;border-radius:16px;background:rgba(243,236,224,.08);border:1px solid rgba(243,236,224,.2)}
.done h3{font-size:32px}
.msgbox{font-size:14px;white-space:pre-wrap;padding:12px;border-radius:10px;background:rgba(0,0,0,.25);user-select:all}
.btn.ghost{background:transparent;border:1px solid rgba(243,236,224,.4);box-shadow:none}

footer{background:var(--green);color:#BFB6A6;padding-block:26px 110px;font-size:13px}
footer .wrap{display:grid;gap:8px}
footer .mark{color:var(--on-green);width:40px;height:40px}

/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--cream) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  transform:translateY(0);transition:transform .25s}
.bar.hide{transform:translateY(110%)}
.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.bar .meta{font-size:12px;line-height:1.25;color:var(--ink-soft)}
.bar .meta b{display:block;font:400 22px/1 var(--f-display);color:var(--ink)}
.bar .btn{min-height:50px;font-size:15px}


/* v2: price, meter, before/after, video, reviews marquee */
.price{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.price>div{display:grid;grid-template-rows:auto 40px;align-items:end;gap:4px}
.price .k{align-self:start}
.price s{display:block;line-height:1;padding-bottom:4px;color:var(--muted);font-size:17px;text-decoration-color:var(--rose);text-decoration-thickness:2px}
.price b{display:block;font:400 38px/1 var(--f-display);color:var(--ink);white-space:nowrap}
.price b small{font:600 14px var(--f-body)}
.k{font-size:13px;color:var(--muted)}
.timer.t3{grid-template-columns:repeat(3,1fr)}
.timer.t4{grid-template-columns:repeat(4,1fr)}
.expired{font-size:14px;color:var(--ink-soft);padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.final .expired{color:#D9D1C2;border-color:rgba(243,236,224,.25)}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--green-2),var(--gold));transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.left{font-size:14px;color:var(--ink-soft)}
.left b{color:var(--rose)}
.recent{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.recent li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:middle}
.ba{margin:0;display:grid;gap:8px}
.ba img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line)}
.ba figcaption{font-size:12px;color:var(--muted)}
.video{display:grid}

.vcard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,26,18,.15),rgba(13,26,18,.8))}
.vcard>*{position:relative}
.play{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
  background:rgba(243,236,224,.92);color:#1F3A2B;box-shadow:0 0 0 10px rgba(243,236,224,.18)}
.play svg{width:30px;height:30px;margin-left:4px}
.vtxt{display:grid}.vtxt b{font:400 26px/1.1 var(--f-display)}.vtxt small{font-size:13px;opacity:.8}
.marquee{margin-top:24px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:12px;width:max-content;animation:slide 40s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.req-head{margin-top:30px}
.req-head+.marquee{margin-top:12px}
.rcard.req p{font:400 21px/1.2 var(--f-display);color:var(--ink)}
.rcard.req .who{font-weight:500;color:var(--muted)}
.rcard{width:280px;flex:none;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;gap:10px;align-content:start}
.rcard .stars{color:var(--gold);letter-spacing:2px}
.rcard p{font-size:14.5px;color:var(--ink-soft)}
.rcard .who{font-size:14px;font-weight:600}
.rtop{display:flex;align-items:center;gap:12px}
.ava{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--green-2);color:var(--on-green);font:400 22px var(--f-display)}
.ava img{width:100%;height:100%;object-fit:cover}
.rcard .stars{font-size:12px}
@keyframes slide{to{transform:translateX(calc(-50% - 6px))}}
.trust div{display:grid;grid-template-rows:auto auto 1fr;gap:6px;align-content:start}
.trust svg{width:26px;height:26px;color:var(--gold);margin-bottom:6px}
.trust b{font-size:24px;line-height:1.05;min-height:2.1em;display:flex;align-items:flex-end}
.faq{padding-top:32px}
@media (min-width:880px){.hero{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:440px;margin:0 auto;
  display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 12px 12px 14px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 18px 40px -18px rgba(20,40,28,.55);animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 0 var(--rose);animation:pulse 1.6s infinite}
.ttxt{display:grid;font-size:12.5px;line-height:1.3;color:var(--ink-soft);min-width:0}
.ttxt b{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.tgo{font:700 13px var(--f-body);color:var(--on-green);background:var(--green);padding:9px 12px;border-radius:10px;text-decoration:none;white-space:nowrap}
.tx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px}
@keyframes pop{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* v3: result, guarantee, compact steps */
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:880px){.res{grid-template-columns:repeat(4,1fr)}}
.res>div{display:grid;gap:6px;align-content:start;padding:14px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.res svg{width:24px;height:24px;color:var(--gold)}

.guar::before{content:"";position:absolute;inset:0;background:linear-gradient(170deg,rgba(13,26,18,.7),rgba(13,26,18,.93))}
.gwrap{position:relative;display:grid;gap:24px;justify-items:start}
.seal{position:relative;width:132px;height:132px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(201,174,126,.55)}
.seal svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 30s linear infinite}
.seal text{font:500 12.5px var(--f-label);letter-spacing:.24em;fill:#C9AE7E}
.seal .mark{width:54px;height:54px;color:#F3ECE0}
@keyframes spin{to{transform:rotate(360deg)}}
.gtext{display:grid;gap:14px;max-width:620px}
.guar h2{font-size:clamp(38px,10.5vw,62px);text-transform:uppercase}
.glead{font-size:17px;color:#E6DECF}
.why2{display:grid;gap:8px;padding:16px 18px;border-left:2px solid #C9AE7E;background:rgba(243,236,224,.06);border-radius:0 12px 12px 0}
.why2 b{font:400 22px/1.1 var(--f-display);color:#F3ECE0}
.why2 p{font-size:15px;color:#D2C9B9}
@media (min-width:880px){.gwrap{grid-template-columns:auto 1fr;align-items:center;gap:48px}.seal{width:200px;height:200px}.seal .mark{width:80px;height:80px}}
.steps4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s4{display:grid;gap:4px;align-content:start;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.s4 .ill{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--paper);display:grid;place-items:center;margin-bottom:6px}
.s4 .ill svg{width:78%;height:78%;color:var(--ink)}
.s4 .no{font:400 13px var(--f-label);letter-spacing:.14em;color:var(--gold)}
.s4 h3{font-size:22px}
.s4 p{font-size:13.5px;line-height:1.4;color:var(--ink-soft)}
@media (min-width:880px){.steps4{grid-template-columns:repeat(4,1fr)}}

/* ===== mobile pass ===== */
html{-webkit-tap-highlight-color:transparent}
a,button,summary,label.chip,input{touch-action:manipulation}
img{max-width:100%}
.top{padding-block:10px}
.top-cta{min-height:40px;display:inline-flex;align-items:center}
.ig-link{display:inline-flex;align-items:center;min-height:44px;color:var(--gold);font-weight:600}
footer a{display:inline-flex;align-items:center;min-height:44px}
.video iframe{height:auto;aspect-ratio:4/5.4;max-height:80vh}
.bar .meta b{font-size:20px}
.toast{grid-template-columns:auto 1fr;padding-right:38px;row-gap:10px}
.tgo{grid-column:1/-1;text-align:center;padding:11px 12px}
@media (min-width:480px){.toast{grid-template-columns:auto 1fr auto}.tgo{grid-column:auto}}
.tx{position:absolute;top:2px;right:2px;width:36px;height:36px}
.price{column-gap:12px}
.price b{font-size:clamp(30px,9vw,38px)}
.offer{padding:16px}
.offer-row .v{text-align:right}
summary{min-height:48px}
@media (max-width:359px){
  .brand b{font-size:12px;letter-spacing:.08em}
  .brand small{font-size:10px}
  .mark{width:30px;height:30px}
  .top-cta{padding:8px 12px;font-size:12.5px}
  .price{grid-template-columns:1fr;row-gap:10px}
  .price>div{grid-template-rows:auto auto}
  .wrap{padding-inline:16px}
  .s4{padding:10px}.s4 h3{font-size:19px}.s4 p{font-size:12.5px}
  .res>div{padding:12px 10px}.res b{font-size:18px}
  .trust div{padding:12px}.trust b{font-size:20px}
  .timer b{font-size:24px}
  .bar .meta b{font-size:18px}
}
@media (min-width:600px) and (max-width:879px){.wrap{max-width:620px}}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.lang a{min-width:40px;min-height:36px;display:grid;place-items:center;border-radius:999px;font:600 12.5px var(--f-body);letter-spacing:.04em;color:var(--ink-soft);text-decoration:none}
.lang a[aria-current]{background:var(--green);color:var(--on-green)}
.top .top-cta{display:none}
@media (min-width:520px){.top .top-cta{display:inline-flex}}
@media (max-width:359px){.lang a{min-width:34px;font-size:11.5px}}
@media (max-width:479px){.brand b{font-size:12px;letter-spacing:.08em;white-space:nowrap}.brand small{font-size:10.5px}.brand{gap:8px}.top{gap:8px}}

.reveal{animation:rise .7s ease both}

/* проверка имени и телефона */
const NAME_WORD = /^[A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]+(?:[-'ʻʼ‘’`][A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]+)*$/;

phone.addEventListener("blur", () => { if (phone.value.replace(/\D/g,"").length > 3) showErr(phone, "#e-phone", checkPhone(phone.value)); });
phone.addEventListener("input", () => { if (!$("#e-phone").hidden) showErr(phone, "#e-phone", checkPhone(phone.value)); });

/* sticky bar прячется у формы */
const bar = $("#bar"), book = $("#book");
/* панель появляется, когда главная кнопка ушла с экрана, и прячется у формы */
let heroVisible = true, formVisible = false;
const syncBar = () => bar.classList.toggle("hide", heroVisible || formVisible);
new IntersectionObserver(([e]) => { heroVisible = e.isIntersecting; syncBar(); }).observe($(".offer .btn"));
new IntersectionObserver(([e]) => { formVisible = e.isIntersecting; syncBar(); }, {threshold: .1}).observe(book);

/* отправка */
$("#lead").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = $("#f-name").value.trim(), tel = phone.value.replace(/\D/g, ""), time = ($("input[name=time]:checked") || {}).value || "";
  const okName = showErr(nameIn, "#e-name", checkName(name));
  const okPhone = showErr(phone, "#e-phone", checkPhone(phone.value));
  if (!okName) { nameIn.focus(); return; }
  if (!okPhone) { phone.focus(); return; }
  // событие заявки для Meta
  if (window.fbq) fbq("track", "Lead");
  // копия заявки администраторам (даже если клиент не напишет в Telegram)
  if (window.ecoSend) ecoSend(name, "+" + tel, time);
  let msg = `Здравствуйте! Хочу записаться на чистку спины по акции: 800 000 сум вместо 1 200 000, оплата после процедуры.\nИмя: ${name}\nТелефон: +${tel}\nУдобно: ${time}`;
  // код рекламы — последней строкой
  const code = window.ecoCode ? ecoCode() : "";
  if (code) msg += "\nКод: " + code;
  if (CONFIG.endpoint) { try { await fetch(CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name, phone:"+"+tel, time, service:"Чистка спины", price:800000, ts:new Date().toISOString()})}); } catch(e) {} }
  $("#d-msg").textContent = msg;
  $("#d-go").href = "https://t.me/" + CONFIG.telegram;
  $("#lead").hidden = true; $("#done").hidden = false;
  copyMsg();
  $("#done").scrollIntoView({block: "center", behavior: "smooth"});
});
/* «Написать нам сейчас»: копируем текст заявки и открываем чат */
function copyMsg(){ try { navigator.clipboard.writeText($("#d-msg").textContent).catch(() => {}); } catch(e) {} }
$("#d-go").addEventListener("click", copyMsg);
$("#d-copy").addEventListener("click", async () => {
  const b = $("#d-copy");
  try { await navigator.clipboard.writeText($("#d-msg").textContent); b.textContent = "Скопировано"; }
  catch(e) { const r = document.createRange(); r.selectNodeContents($("#d-msg")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Текст выделен, скопируйте"; }
});
</script>

<script>
/* ====== НАСТРОЙКИ: меняйте здесь ====== */
const CONFIG = {
  deadline: "2026-10-31T23:59:00+05:00", // конец акции (время Ташкента)
  seatsTotal: 25,

  telegram: "EcoCosmetology",           // Telegram администратора
  instagram: "eco.cosmetology.uz",
  address: "",
  endpoint: "",                         // URL для заявок (бот / Google Apps Script); работает на вашем домене
  embedVideo: true,                // true = видео Instagram встраивается прямо в страницу (на вашем домене)
  videoUrl: "https://www.instagram.com/p/DcdKoi1IVKo/",
  reviews: []                           // [{text:"...", who:"Имя", photo:"https://... (необязательно)"}] — только реальные отзывы клиентов
};
/* ====================================== */

const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

/* места */
const taken = CONFIG.seatsTotal - CONFIG.seatsLeft;
$$("[data-seats]").forEach(e => e.textContent = CONFIG.seatsLeft);
$$("[data-seats-total]").forEach(e => e.textContent = CONFIG.seatsTotal);
$$("[data-taken]").forEach(e => e.textContent = taken);
$$("[data-meter]").forEach(meter => { meter.setAttribute("role","progressbar"); meter.setAttribute("aria-valuemin","0"); meter.setAttribute("aria-valuemax", CONFIG.seatsTotal); meter.setAttribute("aria-valuenow", taken);
  requestAnimationFrame(() => setTimeout(() => meter.firstElementChild.style.width = (taken / CONFIG.seatsTotal * 100) + "%", 250)); });
if (CONFIG.recent.length) { const ul = $("[data-recent]"); CONFIG.recent.slice(0,3).forEach(t => { const li = document.createElement("li"); li.textContent = t + " booked"; ul.appendChild(li); }); ul.hidden = false; }
if (CONFIG.address) $("[data-address]").textContent = CONFIG.address;

/* видео */
if (CONFIG.embedVideo) {
  const f = document.createElement("iframe");
  f.src = CONFIG.videoUrl.replace(/\/?$/, "/") + "embed"; f.loading = "lazy"; f.title = "Treatment video"; f.allow = "autoplay; encrypted-media";
  const box = $("[data-video]"); box.innerHTML = ""; box.appendChild(f);
}

/* отзывы: бегущая лента */
if (CONFIG.reviews.length) {
  const track = $("[data-track]");
  const mk = r => { const c = document.createElement("div"); c.className = "rcard";
    const top = document.createElement("div"); top.className = "rtop";
    const av = document.createElement("span"); av.className = "ava";
    if (r.photo) { const im = document.createElement("img"); im.src = r.photo; im.alt = ""; av.appendChild(im); } else av.textContent = (r.who || "?").trim()[0];
    const nm = document.createElement("div"); const w = document.createElement("div"); w.className = "who"; w.textContent = r.who;
    const st = document.createElement("div"); st.className = "stars"; st.textContent = "★★★★★"; nm.append(w, st);
    top.append(av, nm); const p = document.createElement("p"); p.textContent = r.text; c.append(top, p); return c; };
  [...CONFIG.reviews, ...CONFIG.reviews].forEach((r, i) => { const c = mk(r); if (i >= CONFIG.reviews.length) c.setAttribute("aria-hidden", "true"); track.appendChild(c); });
  $("[data-reviews]").hidden = false;
}

/* типичные запросы: бегущая лента */
const REQUESTS = [
  ["“My friend’s wedding is coming up, I want to wear a backless dress”", "common before holidays"],
  ["“My wife told me to go. I just want my back properly cleaned”", "common from men"],
  ["“I scrub, but the blackheads keep coming back”", "when home care doesn’t help"],
  ["“I always break out on my back after the gym”", "sweat and clothing clog pores"],
  ["“I’m embarrassed to take my shirt off at the pool”", "when skin gets in the way of relaxing"]
];
(() => { const t = $("[data-req]"); if (!t) return;
  [...REQUESTS, ...REQUESTS].forEach(([q, w], i) => { const c = document.createElement("div"); c.className = "rcard req";
    const p = document.createElement("p"); p.textContent = q; const d = document.createElement("div"); d.className = "who"; d.textContent = w;
    c.append(p, d); if (i >= REQUESTS.length) c.setAttribute("aria-hidden", "true"); t.appendChild(c); }); })();

/* таймер: до фиксированной даты окончания акции */
const end = new Date(CONFIG.deadline).getTime();
const DAY = "d";
const pad = n => String(n).padStart(2, "0");
function parts(){ let t = Math.max(0, end - Date.now()) / 1000;
  const d = Math.floor(t/86400); t -= d*86400; const h = Math.floor(t/3600); t -= h*3600; const m = Math.floor(t/60); return [d, h, m, Math.floor(t - m*60)]; }
function tick(){
  if (end <= Date.now()) { expire(); return; }
  const [d, h, m, s] = parts();
  $$("[data-timer]").forEach(w => { $("[data-d]",w).textContent = d; $("[data-h]",w).textContent = pad(h); $("[data-m]",w).textContent = pad(m); $("[data-s]",w).textContent = pad(s); });
}
function expire(){
  if (expire.done) return; expire.done = true;
  $$("[data-timer]").forEach(w => { const p = document.createElement("p"); p.className = "expired"; p.textContent = "The discount has ended. Booking is still free, and you pay after the treatment."; w.replaceWith(p); });
  $$(".price").forEach(pr => { pr.innerHTML = '<div><span class="k">Price</span><b>1,200,000 <small>UZS</small></b></div>'; });
  $$(".disc-lbl, .perprice").forEach(e => e.remove());
  const m = $(".bar .meta"); if (m) m.innerHTML = "<b>Free</b>booking";
  const t = $("#toast"); if (t) t.hidden = true;
}
tick(); setInterval(tick, 1000);

/* честная плашка-напоминание: через 1 минуту, затем каждые 5 минут */
const toast = $("#toast");
function showToast(){ if (!$("#done").hidden || expire.done) return; toast.hidden = false; clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.hidden = true, 9000); }
$("#tx").addEventListener("click", () => toast.hidden = true);
$(".tgo").addEventListener("click", () => toast.hidden = true);
setTimeout(() => { showToast(); setInterval(showToast, 5 * 60e3); }, 60e3);
setInterval(() => { const [d, h, m, s] = parts();
  $("[data-tleft]").textContent = (d ? d + " " + DAY + " " : "") + pad(h) + ":" + pad(m) + ":" + pad(s); }, 1000);

/* маска телефона +998 */
const phone = $("#f-phone");
phone.addEventListener("input", () => {
  let v = phone.value.replace(/\D/g, "");
  if (v.startsWith("998")) v = v.slice(3);
  v = v.slice(0, 9);
  const p = [v.slice(0,2), v.slice(2,5), v.slice(5,7), v.slice(7,9)].filter(Boolean);
  phone.value = "+998 " + p.join(" ");
});
phone.addEventListener("focus", () => { if (!phone.value) phone.value = "+998 "; });

/* проверка имени и телефона */
const NAME_WORD = /^[A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]+(?:[-'ʻʼ‘’`][A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]+)*$/;
const VOWELS = /[аеёиоуыэюяўaeiouy]/i;
const JUNK = ["йцук","цуке","укен","фыва","ывап","вапр","ячсм","чсми","qwer","wert","asdf","sdfg","zxcv","xcvb","test","тест","admin","абвг","abcd","asd","sdf","qwe","zxc","фыв","ыва","йцу","ячс","hjk","jkl"];
function checkName(v){
  v = v.trim().replace(/\s+/g, " ");
  if (!v) return "Please enter your name.";
  if (/\d/.test(v)) return "Names can’t contain numbers.";
  const words = v.split(" ");
  if (words.length > 3) return "Your first name is enough; first and last name is fine too.";
  for (const w of words) {
    if (!NAME_WORD.test(w)) return "Please use letters only, e.g. “Kamola”.";
    const letters = w.replace(/[^A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]/g, "");
    if (letters.length < 2) return "Your name must be at least 2 letters.";
    if (!VOWELS.test(letters)) return "That looks like a typo. Please check your name.";
    if (/(.)\1\1/i.test(letters)) return "That looks like a typo. Please check your name.";
    if (/[^аеёиоуыэюяўaeiouyьъ'ʻʼ‘’`-]{5,}/i.test(w)) return "That looks like a typo. Please check your name.";
    if (/[А-Яа-яЁё]/.test(letters) && /[A-Za-z]/.test(letters)) return "Please use one alphabet: Latin or Cyrillic.";
    const low = letters.toLowerCase();
    if (JUNK.some(j => low.includes(j))) return "Please enter your real name so our administrator knows how to address you.";
  }
  return "";
}
const CODES = ["20","33","50","55","61","62","65","66","67","69","70","71","72","73","74","75","76","77","78","79","88","90","91","93","94","95","97","98","99"];
function checkPhone(raw){
  let d = raw.replace(/\D/g, ""); if (d.startsWith("998")) d = d.slice(3);
  if (d.length !== 9) return "Enter 9 digits after +998.";
  if (!CODES.includes(d.slice(0,2))) return "Check the operator code, e.g. 90, 91, 93, 94, 97, 99, 33, 88, 77.";
  const rest = d.slice(2);
  if (/^(\d)\1+$/.test(d) || /^(\d)\1{6}$/.test(rest)) return "That number doesn’t exist. Please check the digits.";
  if ("01234567890".includes(rest) || "09876543210".includes(rest)) return "That number doesn’t exist. Please check the digits.";
  if (new Set(rest).size <= 2 && /^(\d)\1{4,}/.test(rest)) return "That number doesn’t exist. Please check the digits.";
  return "";
}
function showErr(input, slot, msg){ const e = $(slot); e.textContent = msg; e.hidden = !msg; input.setAttribute("aria-invalid", msg ? "true" : "false"); return !msg; }
const nameIn = $("#f-name");
nameIn.addEventListener("blur", () => { if (nameIn.value.trim()) showErr(nameIn, "#e-name", checkName(nameIn.value)); });
nameIn.addEventListener("input", () => { if (!$("#e-name").hidden) showErr(nameIn, "#e-name", checkName(nameIn.value)); });
phone.addEventListener("blur", () => { if (phone.value.replace(/\D/g,"").length > 3) showErr(phone, "#e-phone", checkPhone(phone.value)); });
phone.addEventListener("input", () => { if (!$("#e-phone").hidden) showErr(phone, "#e-phone", checkPhone(phone.value)); });

/* sticky bar прячется у формы */
const bar = $("#bar"), book = $("#book");
/* панель появляется, когда главная кнопка ушла с экрана, и прячется у формы */
let heroVisible = true, formVisible = false;
const syncBar = () => bar.classList.toggle("hide", heroVisible || formVisible);
new IntersectionObserver(([e]) => { heroVisible = e.isIntersecting; syncBar(); }).observe($(".offer .btn"));
new IntersectionObserver(([e]) => { formVisible = e.isIntersecting; syncBar(); }, {threshold: .1}).observe(book);

/* отправка */
$("#lead").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = $("#f-name").value.trim(), tel = phone.value.replace(/\D/g, ""), time = ($("input[name=time]:checked") || {}).value || "";
  const okName = showErr(nameIn, "#e-name", checkName(name));
  const okPhone = showErr(phone, "#e-phone", checkPhone(phone.value));
  if (!okName) { nameIn.focus(); return; }
  if (!okPhone) { phone.focus(); return; }
  // событие заявки для Meta
  if (window.fbq) fbq("track", "Lead");
  // копия заявки администраторам (даже если клиент не напишет в Telegram)
  if (window.ecoSend) ecoSend(name, "+" + tel, time);
  let msg = `Hello! I’d like to book a back cleansing at the offer price: 800,000 UZS instead of 1,200,000, paid after the treatment.\nName: ${name}\nPhone: +${tel}\nPreferred time: ${time}`;
  // код рекламы — последней строкой
  const code = window.ecoCode ? ecoCode() : "";
  if (code) msg += "\nКод: " + code;
  if (CONFIG.endpoint) { try { await fetch(CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name, phone:"+"+tel, time, service:"Чистка спины", lang:"en", price:800000, ts:new Date().toISOString()})}); } catch(e) {} }
  $("#d-msg").textContent = msg;
  $("#d-go").href = "https://t.me/" + CONFIG.telegram;
  $("#lead").hidden = true; $("#done").hidden = false;
  copyMsg();
  $("#done").scrollIntoView({block: "center", behavior: "smooth"});
});
/* «Написать нам сейчас»: копируем текст заявки и открываем чат */
function copyMsg(){ try { navigator.clipboard.writeText($("#d-msg").textContent).catch(() => {}); } catch(e) {} }
$("#d-go").addEventListener("click", copyMsg);
$("#d-copy").addEventListener("click", async () => {
  const b = $("#d-copy");
  try { await navigator.clipboard.writeText($("#d-msg").textContent); b.textContent = "Copied"; }
  catch(e) { const r = document.createRange(); r.selectNodeContents($("#d-msg")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Text selected, copy it"; }
});
</script>

<script>
/* Язык: ?lang=ru|uz|en → сохранённый выбор → узбекский телефон → русский */
(function () {
  var L = ['ru','uz','en'], q = new URLSearchParams(location.search), lang = q.get('lang');
  if (L.indexOf(lang) < 0) { try { lang = localStorage.getItem('eco_lang'); } catch (e) {} }
  if (L.indexOf(lang) < 0) lang = /^uz/i.test(navigator.language || '') ? 'uz' : 'ru';
  try { localStorage.setItem('eco_lang', lang); } catch (e) {}
  var TITLES = {ru: 'Eco Чистка спины', uz: 'Eco Orqani tozalash', en: 'Eco Back Cleansing'};
  document.documentElement.lang = lang; document.title = TITLES[lang];
  var frag = document.getElementById('t-' + lang).content.cloneNode(true);
  var scripts = [].slice.call(frag.querySelectorAll('script'));
  scripts.forEach(function (s) { s.parentNode.removeChild(s); });
  document.body.insertBefore(frag, document.getElementById('t-ru'));
  [].forEach.call(document.querySelectorAll('.lang a'), function (a) {
    var l = a.getAttribute('hreflang'), p = new URLSearchParams(location.search);
    p.set('lang', l); a.href = '?' + p.toString();
    a.addEventListener('click', function () { try { localStorage.setItem('eco_lang', l); } catch (e) {} });
  });
  scripts.forEach(function (s) { var n = document.createElement('script'); n.textContent = s.textContent; document.body.appendChild(n); });
})();
</script>
<script>
(function () {
  var KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'];
  var store = {};
  try { store = JSON.parse(localStorage.getItem('eco_utm') || '{}'); } catch (e) {}
  if (store.t && Date.now() - store.t > 30 * 864e5) store = {};
  var q = new URLSearchParams(location.search), fresh = false;
  KEYS.forEach(function (k) { if (q.get(k)) { store[k] = q.get(k); fresh = true; } });
  if (fresh) { store.t = Date.now(); try { localStorage.setItem('eco_utm', JSON.stringify(store)); } catch (e) {} }

  // Код рекламы из названия объявления: «[ECO-11] UGC спина» → «ECO-11»
  window.ecoCode = function () {
    var m = String(store.utm_term || '').match(/ECO[\s\-_]*0*(\d{1,3})/i);
    if (m) return 'ECO-' + ('0' + m[1]).slice(-2);
    return store.utm_source ? 'ECO-00' : '';
  };

  // Копия заявки в аналитику → бот присылает её администраторам в Telegram-группу
  window.ecoSend = function (name, phone, time) {
    try {
      var c = (document.cookie.match(/_fbp=([^;]+)/) || [])[1] || '';
      var body = JSON.stringify(Object.assign({}, store, {
        name: name, phone: phone, time: time,
        page: location.pathname, url: location.href, fbp: c
      }));
      navigator.sendBeacon('https://rakurs-neon.vercel.app/api/hook/site/eco',
        new Blob([body], { type: 'text/plain' }));
    } catch (e) {}
  };
})();
</script>
